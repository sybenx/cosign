[package]
name = "keykin-frost"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Keykin Core's FROST calls (frost-secp256k1-tr 2.2) with 32-byte identifiers and hedged nonces"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
frost-secp256k1-tr = "2.2"
frost-core = "2.2"
k256 = { version = "0.13", features = ["arithmetic"] }
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = { version = "0.2" }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }
jni = { version = "0.21", optional = true }

[profile.release]
opt-level = "s"
lto = true

[features]
wasm = ["dep:wasm-bindgen", "getrandom/js"]
jni = ["dep:jni"]
