# The Cosign server image, ghcr.io/sybenx/cosign-server, for amd64 and arm64: built from
# server/ for every release (release.sh makes one per version), tagged with the version
# (0.11.1), its minor line (0.11) and latest. Sidecar packages for relays use it.
name: server image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (e.g. v0.11.1)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - id: v
        run: |
          tag="${{ inputs.tag || github.event.release.tag_name }}"
          v="${tag#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/sybenx/cosign
            org.opencontainers.image.description=Cosign server: a co-signer for Nostr keys split between your devices and your servers
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/sybenx/cosign-server:${{ steps.v.outputs.version }}
            ghcr.io/sybenx/cosign-server:${{ steps.v.outputs.minor }}
            ghcr.io/sybenx/cosign-server:latest
