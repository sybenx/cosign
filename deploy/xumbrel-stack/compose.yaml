# Dockge stack `cosign` on xumbrel: the Cosign server as a sidecar to syb.lol's relay,
# in a stack of its own so no button here (Deploy, Update, Stop, Restart) can touch the
# relay's stack, and no button there can touch this one.
#
# It joins the relay stack's network to reach Ditto at ws://relay:13131, and tells
# phones and sites wss://syb.lol. On first start it makes a throwaway key in
# /data/cosign (= ~/umbrel/app-data/dockge/data/docker/cosign, owned by uid 1000).
# Its page (pairing code, sites, Remove) has no login: port 8711 is for the LAN and
# tailnet only; syb.lol's tunnel goes to the relay's 13131, never here.
#
# Press Deploy to start or update it. The image is built here from ./server, never
# downloaded (pull_policy: build), so Update rebuilds it instead of failing.
services:
  cosign:
    build: ./server
    image: cosign-server:0.5.0
    pull_policy: build
    user: "1000:1000"
    environment:
      COSIGN_RELAY_MAP: wss://syb.lol=ws://relay:13131
      COSIGN_RELAYS: wss://syb.lol,wss://nos.lol,wss://relay.primal.net
    volumes:
      - /data/cosign:/data
    ports:
      - 8711:8711
    networks:
      - relay
    restart: unless-stopped

networks:
  relay:
    name: ditto-relay_default
    external: true
